<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="d-flex flex-column min-vh.100">
    
    <header class="bg-white border-bottom border-success border-4 shadow-sm">
        <div class="container-fluid px-4 py-3 d-flex justify-content-between align-items-center">
            <div>
                <h1 class="h4 mb-9 text-success fw-bold">Eventos</h1>
                <small class="text-muted">Gestión de ventas</small>
            </div>
            <span class="badge text-bg-success">Ventas</span>
        </div>
    </header>

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">
            <nav class="col-12 col-md-13 col-lg-2 bg-dark p-3">
                <p class="text-secondary text-uppercase small-mb-2">Menú</p>
                <ul class="nav nav-pills flex-row flex-md-column gap-1">
                    <li class="nav-item"><a class="nav-link text-white" href="./html/clientes.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="index.html">Eventos</a></li>
                </ul>
            </nav>

            <main class="col-12 col-md-9 col-lg-10 p-4 bg-body-tertiary">
                <div id="alertContainer"></div>

                <div class="card shadow-sm mb-4 border-start border-success border-4">
                    <div class="card-body">
                        <h2 class="h5 text-success mb-3" id="tituloForm">Registrar Eventos</h2>
                        <form action="formEventos" novalidate>
                            <div class="col-12 col-md-6">
                                <label for="txtNombreEvento" class="form-label">Nombre</label>
                                <input type="text" name="form-control" id="txtNombreEvento">
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="txtFechaEvento" class="form-label">Fecha</label>
                                <input type="date" name="form-control" id="txtFechaEvento">
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="txtCantidadPersonas" class="form-label">Cantidad de personas</label>
                                <input type="number" name="form-control" id="txtTelefono" step="1">
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="txtCantidadHoras" class="form-label">Cantidad de horas</label>
                                <input type="number" name="form-control" id="txtCantidadHoras" step="1">
                            </div>
                            <div class="col-6 col-md-3">
                                <label for="txtEstado" class="form-label">Estado</label>
                                <input type="text" name="form-control" id="txtEstado">
                            </div>
                            <div class="mt-4 d-flex gap-2">
                                <button type="submit" id="btnGuardar" class="btn btn-success">Guardar</button>
                                <button type="button" id="btnCancelar" class="btn btn-outline-secondary">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
    
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 text-success mb-3">Listado de eventos</h2>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-success">
                                    <tr>
                                        <th>#</th><th>Nombre</th><th>Fecha</th><th>Personas</th><th>Horas</th><th>Estado</th><th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaEventos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer class="bg-white border-top text-center text-muted py-3">
        <small>&copysr; 2026 Ventas - ITR</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src=""></script>
</body>
</html>
